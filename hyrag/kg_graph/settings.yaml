# hyrag/kg_graph/settings.yaml — the settings R3 actually ran under.
#
# Versioned on purpose (§7.5): a benchmark row whose configuration lives only in a
# generated directory is not reproducible. `hyrag.kg_graph.inputs` copies this file into the
# GraphRAG root at index time and records its sha256 beside the run's numbers, so "which
# config produced this table" has one answer.
#
# Three placeholders are substituted from the environment when GraphRAG loads the file
# (graphrag_common.config → `Template(text).substitute(os.environ)`):
#
#     DEEPSEEK_API_KEY      from the repo-root `.env`, never written to disk
#     HYRAG_LLM_BASE        our serving app, `http://127.0.0.1:8001/v1` by default — the chat
#                           route repairs DeepSeek's missing `json_schema` support (see
#                           `hyrag/serving/llm.py`) and counts every token
#     HYRAG_EMBEDDING_BASE  the same service's embeddings route
#
# Two completion models, mirroring `kg-light`'s roles: extraction-side work (entity/relation
# extraction, description summaries, community reports) runs with DeepSeek's thinking
# **disabled**, because a reasoning trace arrives before the JSON that the parser needs; the
# query side keeps thinking on. `call_args` is merged straight into the litellm call, which
# is how `extra_body` reaches the request body.

completion_models:
  extract_completion_model:
    model_provider: deepseek
    model: deepseek-flash
    api_base: ${HYRAG_LLM_BASE}
    api_key: ${DEEPSEEK_API_KEY}
    call_args:
      extra_body: {"thinking": {"type": "disabled"}}
      extra_headers: {"X-Hyrag-Row": "kg-graph"}  # how the proxy log attributes the call
    retry:
      type: exponential_backoff
    metrics:
      writer: file
      base_dir: metrics
  query_completion_model:
    model_provider: deepseek
    model: deepseek-flash
    api_base: ${HYRAG_LLM_BASE}
    api_key: ${DEEPSEEK_API_KEY}
    call_args:
      extra_headers: {"X-Hyrag-Row": "kg-graph"}
    retry:
      type: exponential_backoff
    metrics:
      writer: file
      base_dir: metrics

embedding_models:
  default_embedding_model:
    model_provider: openai
    model: bge-m3
    api_base: ${HYRAG_EMBEDDING_BASE}
    api_key: hyrag-local  # our endpoint has no auth; the OpenAI client requires a value
    retry:
      type: exponential_backoff

### Document processing ###

concurrent_requests: 12

input:
  type: text  # one .txt per chunk; the chunker has nothing to re-decide

chunking:
  type: tokens
  size: 1500  # above our 1200-token cap, so a chunk is never split
  overlap: 0  # and never re-glued
  encoding_model: o200k_base  # the same tokenizer the chunker's cap was measured with

input_storage:
  type: file
  base_dir: input

output_storage:
  type: file
  base_dir: output

reporting:
  type: file
  base_dir: logs

cache:
  type: json
  storage:
    type: file
    base_dir: cache

vector_store:
  type: lancedb
  db_uri: output/lancedb
  vector_size: 1024  # the endpoint's dimension; GraphRAG fails fast on a mismatch

### Workflows ###

embed_text:
  embedding_model_id: default_embedding_model

extract_graph:
  completion_model_id: extract_completion_model
  prompt: prompts/extract_graph.txt
  entity_types: [organization, person, geo, event]  # GraphRAG's shipped default, kept
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: extract_completion_model
  prompt: prompts/summarize_descriptions.txt
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english

cluster_graph:
  max_cluster_size: 10
  seed: 42  # Leiden is stochastic; an unseeded run cannot be reproduced

extract_claims:
  enabled: false

community_reports:
  completion_model_id: extract_completion_model
  graph_prompt: prompts/community_report_graph.txt
  text_prompt: prompts/community_report_text.txt
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: true
  embeddings: false

### Query ###

local_search:
  completion_model_id: query_completion_model
  embedding_model_id: default_embedding_model
  prompt: prompts/local_search_system_prompt.txt

global_search:
  completion_model_id: query_completion_model
  map_prompt: prompts/global_search_map_system_prompt.txt
  reduce_prompt: prompts/global_search_reduce_system_prompt.txt
  knowledge_prompt: prompts/global_search_knowledge_system_prompt.txt

drift_search:
  completion_model_id: query_completion_model
  embedding_model_id: default_embedding_model
  prompt: prompts/drift_search_system_prompt.txt
  reduce_prompt: prompts/drift_search_reduce_prompt.txt

basic_search:
  completion_model_id: query_completion_model
  embedding_model_id: default_embedding_model
  prompt: prompts/basic_search_system_prompt.txt
