[project]
name = "hyrag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "docling>=2.135.0",
    "fastapi>=0.143.2",
    "lightrag-hku",
    "openai>=3.31.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]

[tool.uv.sources]
